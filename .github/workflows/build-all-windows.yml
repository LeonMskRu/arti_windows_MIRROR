name: Build Arti + Transports (Windows x64 + TEST)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # ежедневно 06:00 UTC

permissions:
  contents: write

env:
  ARTI_MIRROR_REPO: arti-mirror   # имя зеркала — меняйте здесь
  LYREBIRD_REF:     main          # можно заменить на конкретный тег/коммит
  SNOWFLAKE_REF:    main
  WEBTUNNEL_REF:    main

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      # ──────────────────────────────────────────
      # Checkout meta repo
      # ──────────────────────────────────────────
      - name: Checkout meta repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1       # мета-репо содержит только workflows

      # ──────────────────────────────────────────
      # Clone Arti mirror
      # ──────────────────────────────────────────
      - name: Clone Arti mirror
        run: |
          git clone `
            https://github.com/${{ github.repository_owner }}/${{ env.ARTI_MIRROR_REPO }} `
            arti

      - name: Show last 5 Arti tags (debug)
        working-directory: arti
        run: |
          Write-Host "=== Последние теги Arti ==="
          git tag -l "arti-*" --sort=-v:refname | Select-Object -First 5

      - name: Detect latest Arti version
        id: arti_ver
        working-directory: arti
        run: |
          $ver = git tag --list "arti-*" --sort=-v:refname | Select-Object -First 1
          if ([string]::IsNullOrEmpty($ver)) {
            Write-Error "❌ No arti-* tags found in mirror. Cannot proceed."
            exit 1
          }
          "arti_version=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV
          Write-Host "✅ Latest Arti version: $ver"

      # ──────────────────────────────────────────
      # Пропуск если релиз уже существует
      # ──────────────────────────────────────────
      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = $env:arti_version
          $exists = gh release view $ver 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "⏭️ Release $ver already exists — skipping build."
            "skip=true"  | Out-File -Append $env:GITHUB_OUTPUT
          } else {
            Write-Host "🆕 Release $ver not found — proceeding with build."
            "skip=false" | Out-File -Append $env:GITHUB_OUTPUT
          }

      - name: Checkout latest Arti tag
        if: steps.check_release.outputs.skip == 'false'
        working-directory: arti
        run: git checkout $env:arti_version

      # ──────────────────────────────────────────
      # Rust toolchain
      # ──────────────────────────────────────────
      - name: Setup Rust (MSVC x64)
        if: steps.check_release.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ──────────────────────────────────────────
      # Cargo cache
      # ──────────────────────────────────────────
      - name: Cache Cargo registry + build
        if: steps.check_release.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            arti/target
          key: cargo-win-x64-${{ env.arti_version }}
          restore-keys: |
            cargo-win-x64-

      # ──────────────────────────────────────────
      # SQLite (bundled через feature — не зависит от choco)
      # rusqlite bundled сам компилирует sqlite из исходников
      # Если arti использует SQLITE3_LIB_DIR — оставьте блок ниже
      # ──────────────────────────────────────────
      - name: Install SQLite static lib (если нужна внешняя)
        if: steps.check_release.outputs.skip == 'false'
        run: |
          # vcpkg даёт статическую .lib, а не .dll как choco
          vcpkg install sqlite3:x64-windows-static
          $vcpkgRoot = (vcpkg env VCPKG_ROOT 2>$null)
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $libDir = "$vcpkgRoot\installed\x64-windows-static\lib"
          "SQLITE3_LIB_DIR=$libDir"   | Out-File -Append $env:GITHUB_ENV
          "SQLITE3_STATIC=1"           | Out-File -Append $env:GITHUB_ENV
          Write-Host "✅ SQLITE3_LIB_DIR=$libDir"

      # ──────────────────────────────────────────
      # Build Arti STABLE x64
      # ──────────────────────────────────────────
      - name: Build arti.exe (stable, x64)
        if: steps.check_release.outputs.skip == 'false'
        working-directory: arti
        run: |
          cargo build --release `
            --target x86_64-pc-windows-msvc `
            --package arti `
            --bin arti `
            --features static

      - name: Copy arti stable binary
        if: steps.check_release.outputs.skip == 'false'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item arti/target/x86_64-pc-windows-msvc/release/arti.exe `
                    dist/arti-x64.exe -Force
          Write-Host "✅ dist/arti-x64.exe ready"

      # ──────────────────────────────────────────
      # Build Arti TEST x64 (экспериментальные фичи)
      # ──────────────────────────────────────────
      - name: Build arti.exe (TEST — conflux + vanguards, x64)
        if: steps.check_release.outputs.skip == 'false'
        id: test_build
        working-directory: arti
        continue-on-error: true
        run: |
          Write-Host "🛠️ Starting TEST build (conflux, vanguards)..."
          cargo build --release `
            --target x86_64-pc-windows-msvc `
            --package arti `
            --bin arti `
            --features "static,conflux,vanguards" `
            --verbose

      - name: Copy arti TEST binary
        if: steps.check_release.outputs.skip == 'false'
        continue-on-error: true
        run: |
          $src = "arti/target/x86_64-pc-windows-msvc/release/arti.exe"
          if (Test-Path $src) {
            Copy-Item $src dist/arti-x64-test.exe -Force
            Write-Host "✅ dist/arti-x64-test.exe ready"
          } else {
            Write-Host "⚠️ TEST build did not produce arti.exe — skipping"
          }

      # ──────────────────────────────────────────
      # Go toolchain (транспорты)
      # ──────────────────────────────────────────
      - name: Setup Go
        if: steps.check_release.outputs.skip == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # ──────────────────────────────────────────
      # Lyrebird
      # ──────────────────────────────────────────
      - name: Clone lyrebird (${{ env.LYREBIRD_REF }})
        if: steps.check_release.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.LYREBIRD_REF }} `
            https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/lyrebird.git

      - name: Build lyrebird x64
        if: steps.check_release.outputs.skip == 'false'
        working-directory: lyrebird/cmd/lyrebird
        run: go build -o ../../../dist/lyrebird-x64.exe .

      # ──────────────────────────────────────────
      # Snowflake
      # ──────────────────────────────────────────
      - name: Clone snowflake (${{ env.SNOWFLAKE_REF }})
        if: steps.check_release.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.SNOWFLAKE_REF }} `
            https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/snowflake.git

      - name: Build snowflake-client x64
        if: steps.check_release.outputs.skip == 'false'
        working-directory: snowflake/client
        run: go build -o ../../dist/snowflake-client-x64.exe .

      # ──────────────────────────────────────────
      # WebTunnel
      # ──────────────────────────────────────────
      - name: Clone webtunnel (${{ env.WEBTUNNEL_REF }})
        if: steps.check_release.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch ${{ env.WEBTUNNEL_REF }} `
            https://gitlab.torproject.org/tpo/anti-censorship/pluggable-transports/webtunnel.git

      - name: Build webtunnel-client x64
        if: steps.check_release.outputs.skip == 'false'
        working-directory: webtunnel/main/client
        run: go build -o ../../../dist/webtunnel-client-x64.exe .

      # ──────────────────────────────────────────
      # Packaging: отдельные ZIP-ы
      # ──────────────────────────────────────────
      - name: Create ZIPs
        if: steps.check_release.outputs.skip == 'false'
        run: |
          # Stable — обязателен; если .exe нет — падаем явно
          if (-not (Test-Path dist/arti-x64.exe)) {
            Write-Error "❌ dist/arti-x64.exe not found — stable build failed"
            exit 1
          }
          Compress-Archive -Path dist/arti-x64.exe             -DestinationPath dist/arti-x64.zip -Force

          # TEST — необязателен
          if (Test-Path dist/arti-x64-test.exe) {
            Compress-Archive -Path dist/arti-x64-test.exe      -DestinationPath dist/arti-x64-test.zip -Force
            Write-Host "✅ arti-x64-test.zip created"
          } else {
            Write-Host "⚠️ arti-x64-test.exe missing — skipping test zip"
          }

          Compress-Archive -Path dist/lyrebird-x64.exe         -DestinationPath dist/lyrebird-x64.zip          -Force
          Compress-Archive -Path dist/snowflake-client-x64.exe -DestinationPath dist/snowflake-x64.zip         -Force
          Compress-Archive -Path dist/webtunnel-client-x64.exe -DestinationPath dist/webtunnel-x64.zip         -Force

          # bundle.zip из всех .exe
          Compress-Archive -Path dist/*.exe                    -DestinationPath dist/bundle-executables.zip    -Force

      # ──────────────────────────────────────────
      # SHA256 — только для .zip файлов
      # ──────────────────────────────────────────
      - name: SHA256 checksums (only .zip)
        if: steps.check_release.outputs.skip == 'false'
        run: |
          $zips = Get-ChildItem dist -Filter *.zip
          if ($zips.Count -gt 0) {
            $zips | ForEach-Object {
              $h = Get-FileHash $_.FullName -Algorithm SHA256
              "$($h.Hash)  $($_.Name)"
            } | Out-File dist/SHA256SUMS.txt -Encoding ascii
            Write-Host "✅ SHA256SUMS.txt written for $($zips.Count) zip(s)"
          } else {
            Write-Error "❌ No ZIP files found for checksum"
            exit 1
          }

      # ──────────────────────────────────────────
      # Release notes
      # ──────────────────────────────────────────
      - name: Prepare release notes
        if: steps.check_release.outputs.skip == 'false'
        run: |
          $testNote = if (Test-Path dist/arti-x64-test.exe) {
            "- **arti-x64-test** — experimental build with: ``static``, ``conflux``, ``vanguards``"
          } else {
            "- **arti-x64-test** — TEST build FAILED (skipped)"
          }

          @"
          ## Tor / Arti Windows x64 Bundle

          | Binary | Source |
          |--------|--------|
          | **arti-x64** | Arti ${{ env.arti_version }} — stable build (``--features static``) |
          $testNote |
          | **lyrebird-x64** | lyrebird ``${{ env.LYREBIRD_REF }}`` |
          | **snowflake-client-x64** | snowflake ``${{ env.SNOWFLAKE_REF }}`` |
          | **webtunnel-client-x64** | webtunnel ``${{ env.WEBTUNNEL_REF }}`` |

          Verify downloads with ``SHA256SUMS.txt``.
          "@ | Out-File RELEASE_NOTES.md -Encoding utf8

      # ──────────────────────────────────────────
      # GitHub Release
      # ──────────────────────────────────────────
      - name: Create GitHub Release
        if: steps.check_release.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.arti_version }}
          name: "Tor bundle (${{ env.arti_version }})"
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            dist/arti-x64.zip
            dist/arti-x64-test.zip
            dist/lyrebird-x64.zip
            dist/snowflake-x64.zip
            dist/webtunnel-x64.zip
            dist/bundle-executables.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
